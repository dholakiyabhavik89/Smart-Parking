<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Smart Parking</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    background:#f4f7fb;
    color:#222;
}

/* Header */
.header{
    background:linear-gradient(135deg,#0879d1,#0056a6);
    color:white;
    text-align:center;
    padding:28px 10px;
}

.header h1{
    font-size:32px;
}

.header p{
    margin-top:8px;
    font-size:15px;
}

/* Main */
.container{
    max-width:1000px;
    margin:auto;
    padding:25px 15px;
}

/* Statistics */
.stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:15px;
    margin-bottom:30px;
}

.stat{
    background:white;
    padding:22px 10px;
    text-align:center;
    border-radius:15px;
    box-shadow:0 4px 15px rgba(0,0,0,0.08);
}

.stat h3{
    font-size:15px;
    color:#666;
}

.stat p{
    font-size:30px;
    font-weight:bold;
    margin-top:8px;
}

.total p{color:#1769aa;}
.occupied p{color:#e53935;}
.available p{color:#159447;}
.booked p{color:#d49b00;}

/* Parking */
.title{
    text-align:center;
    margin-bottom:20px;
    font-size:25px;
}

.parking-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:18px;
}

.slot{
    background:white;
    border-radius:15px;
    padding:20px 10px;
    text-align:center;
    box-shadow:0 4px 15px rgba(0,0,0,0.08);
}

.slot h3{
    margin-bottom:15px;
}

.circle{
    width:75px;
    height:75px;
    border-radius:50%;
    margin:auto;
    display:flex;
    align-items:center;
    justify-content:center;
    color:white;
    font-size:13px;
    font-weight:bold;
}

.available-circle{
    background:#35a853;
}

.occupied-circle{
    background:#e53935;
}

.booked-circle{
    background:#f2b705;
}

.status{
    margin-top:12px;
    font-weight:bold;
}

.book-btn{
    margin-top:12px;
    border:none;
    padding:9px 18px;
    border-radius:8px;
    background:#0879d1;
    color:white;
    cursor:pointer;
}

.book-btn:hover{
    background:#0056a6;
}

/* Legend */
.legend{
    text-align:center;
    margin-top:30px;
}

.legend span{
    margin:0 10px;
    font-weight:bold;
}

.dot{
    display:inline-block;
    width:12px;
    height:12px;
    border-radius:50%;
    margin-right:5px;
}

.green{background:#35a853;}
.red{background:#e53935;}
.yellow{background:#f2b705;}

/* Footer */
.footer{
    text-align:center;
    margin-top:30px;
    padding:20px;
    color:#777;
    font-size:14px;
}

/* Mobile */
@media(max-width:700px){

    .stats{
        grid-template-columns:repeat(2,1fr);
    }

    .parking-grid{
        grid-template-columns:repeat(2,1fr);
    }

    .header h1{
        font-size:25px;
    }
}
</style>
</head>

<body>

<!-- HEADER -->
<div class="header">
    <h1>🚗 SMART PARKING</h1>
    <p>IoT Based Smart Parking System</p>
</div>

<div class="container">

<!-- STATISTICS -->
<div class="stats">

    <div class="stat total">
        <h3>Total Parking</h3>
        <p id="total">8</p>
    </div>

    <div class="stat occupied">
        <h3>Occupied</h3>
        <p id="occupied">0</p>
    </div>

    <div class="stat available">
        <h3>Available</h3>
        <p id="available">8</p>
    </div>

    <div class="stat booked">
        <h3>Booked</h3>
        <p id="booked">0</p>
    </div>

</div>

<h2 class="title">🅿️ Parking Slots</h2>

<!-- PARKING SLOTS -->
<div class="parking-grid" id="parkingGrid"></div>

<!-- LEGEND -->
<div class="legend">
    <span>
        <i class="dot green"></i> Available
    </span>

    <span>
        <i class="dot red"></i> Occupied
    </span>

    <span>
        <i class="dot yellow"></i> Booked
    </span>
</div>

<div class="footer">
    Last Updated: <span id="time">--:--:--</span>
    <br><br>
    Smart Parking System | IoT Project
</div>

</div>

<script>

/* 
   0 = Available
   1 = Occupied
   2 = Booked
*/

let parkingStatus = [
    0,0,0,0,
    0,0,0,0
];

function createSlots(){

    const grid = document.getElementById("parkingGrid");

    grid.innerHTML = "";

    let occupied = 0;
    let available = 0;
    let booked = 0;

    parkingStatus.forEach((status,index)=>{

        let text = "";
        let circleClass = "";
        let statusText = "";

        if(status === 0){

            text = "EMPTY";
            circleClass = "available-circle";
            statusText = "Available";
            available++;

        }

        else if(status === 1){

            text = "FULL";
            circleClass = "occupied-circle";
            statusText = "Occupied";
            occupied++;

        }

        else{

            text = "BOOKED";
            circleClass = "booked-circle";
            statusText = "Booked";
            booked++;

        }

        grid.innerHTML += `
            <div class="slot">

                <h3>Slot ${index+1}</h3>

                <div class="circle ${circleClass}">
                    ${text}
                </div>

                <div class="status">
                    ${statusText}
                </div>

                ${
                    status === 0
                    ?
                    `<button class="book-btn"
                    onclick="bookSlot(${index})">
                    Book Slot
                    </button>`
                    :
                    ``
                }

            </div>
        `;
    });

    document.getElementById("total").innerText =
        parkingStatus.length;

    document.getElementById("occupied").innerText =
        occupied;

    document.getElementById("available").innerText =
        available;

    document.getElementById("booked").innerText =
        booked;

    updateTime();
}


/* BOOK SLOT */

function bookSlot(index){

    if(parkingStatus[index] === 0){

        parkingStatus[index] = 2;

        alert("Slot " + (index+1) + " booked successfully!");

        createSlots();
    }
}


/* TIME */

function updateTime(){

    let now = new Date();

    document.getElementById("time").innerText =
        now.toLocaleTimeString();
}


/* LOAD WEBSITE */

createSlots();

</script>

</body>
</html>
